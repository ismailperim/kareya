name = "kareya-portal"
main = ".open-next/worker.js"
compatibility_date = "2025-03-25"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Custom domain — portal. The kareya.app zone must be in this CF account (OK).
# wrangler provisions the DNS record + TLS certificate automatically; the
# hostname must be free beforehand (an existing record would conflict).
[[routes]]
pattern = "portal.kareya.app"
custom_domain = true

# Non-secret runtime config. The ElevenLabs agent id is an identifier (safe to
# commit); the API key that authorizes it is a SECRET set separately.
[vars]
ELEVENLABS_AGENT_ID = "agent_8201kx3ndd9beap91s6ksacsfvcv"

# SECRETS — never in wrangler.toml. Set in prod via `wrangler secret put <NAME>`
# or the CF dashboard (Worker > Settings > Variables and Secrets). Local: `.dev.vars`.
#   DATABASE_URL         (Neon connection string)
#   ELEVENLABS_API_KEY   (ElevenLabs API key — mints per-session voice tokens)
